<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이벤트 루프와 싱글 스레드</title>
<style>
:root{
  --bg:#fbfbf9; --card:#f3f2ee; --paper:#ffffff; --ink:#1f1f1d; --sub:#6b6a64; --mute:#a3a29b; --line:#d9d8d1;
  --acc-bg:#eceafc; --acc-bd:#534ab7; --acc-tx:#3c3489;
  --ok-bg:#e8f2da; --ok-bd:#3b6d11; --ok-tx:#27500a;
  --warn-bg:#faeeda; --warn-bd:#854f0b; --warn-tx:#633806;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1b19; --card:#252523; --paper:#1b1b19; --ink:#ecebe6; --sub:#a3a29b; --mute:#6f6e68; --line:#3d3d39;
    --acc-bg:#2a2750; --acc-bd:#8f88e6; --acc-tx:#d4d1fa;
    --ok-bg:#243316; --ok-bd:#7fb04a; --ok-tx:#d2e8b5;
    --warn-bg:#41290c; --warn-bd:#d9993f; --warn-tx:#f6d9a8;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cnt{color:var(--sub);font-size:14px;white-space:nowrap}
.stitle{color:var(--acc-tx);font-size:18px;font-weight:600;margin:4px 0 14px;min-height:28px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);margin-bottom:12px}
.lb{font-size:13px;color:var(--sub);margin-bottom:6px}
.code{font-family:ui-monospace,"SF Mono","D2Coding",Menlo,Consolas,monospace;font-size:14px;line-height:1.9;overflow-x:auto}
.code div{padding:0 8px;border-radius:5px;white-space:pre}
.code div.on{background:var(--acc-bg);color:var(--acc-tx)}
.thread{border:2px solid var(--acc-bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.thead{display:flex;justify-content:space-between;align-items:center}
.thead b{color:var(--acc-tx);font-size:16px;font-weight:600}
.state{font-size:13px;padding:2px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.state.run{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
.hint{font-size:13px;color:var(--sub);margin:2px 0 10px}
.stackbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);min-height:150px;display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column-reverse;gap:6px;flex:1;justify-content:flex-start}
.chip{font-family:ui-monospace,"SF Mono","D2Coding",Menlo,Consolas,monospace;font-size:13px;padding:5px 10px;border-radius:6px;text-align:center;border:1px solid}
.chip.cs{background:var(--acc-bg);color:var(--acc-tx);border-color:var(--acc-bd)}
.chip.mt{background:var(--paper);color:var(--ok-tx);border-color:var(--ok-bd)}
.chip.tk{background:var(--paper);color:var(--warn-tx);border-color:var(--warn-bd)}
.chip.wa{background:var(--paper);color:var(--sub);border-color:var(--sub)}
.empty{font-size:13px;color:var(--mute)}
.loop{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;text-align:center;font-size:14px;color:var(--sub);margin-bottom:12px;transition:background .2s,color .2s}
.loop.on{background:var(--acc-bg);border:2px solid var(--acc-bd);color:var(--acc-tx);padding:7px 11px}
.q{min-height:78px}
.q.mon{background:var(--ok-bg);border:2px solid var(--ok-bd);padding:11px 13px}
.q.mon .lb{color:var(--ok-tx)}
.q.ton{background:var(--warn-bg);border:2px solid var(--warn-bd);padding:11px 13px}
.q.ton .lb{color:var(--warn-tx)}
.q .chip{display:inline-block;min-width:200px}
.web{border:1px solid var(--sub);border-radius:12px;padding:12px 14px;margin-bottom:12px;min-height:104px}
.web b{font-size:16px;font-weight:600}
.row{display:flex;gap:12px;margin-bottom:12px}
.row .box{margin:0}
.t{flex:0 0 150px}.o{flex:1}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.out{font-size:19px;font-weight:600;min-height:32px}
.note{font-size:16px;min-height:78px;margin:4px 0 14px}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc-bd)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.dot:focus-visible{outline:2px solid var(--acc-bd);outline-offset:2px}
button.primary{background:var(--acc-bd);border-color:var(--acc-bd);color:var(--paper)}
.dots{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot.cur{background:var(--acc-bd)}
@media (max-width:480px){
  .row{flex-direction:column}.t{flex:1}.dots{margin-left:0;width:100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>이벤트 루프와 싱글 스레드</h1><div class="cnt" id="cnt"></div></div>
  <div class="stitle" id="stitle"></div>

  <div class="box code" id="code"></div>

  <div class="thread">
    <div class="thead"><b>자바스크립트 스레드</b><span class="state" id="state"></span></div>
    <div class="hint">싱글 스레드: 한 번에 하나의 함수만 실행</div>
    <div class="stackbox">
      <div class="lb">콜스택 (맨 위가 지금 실행 중)</div>
      <div class="stack" id="stack"></div>
    </div>
  </div>

  <div class="loop" id="loop"></div>

  <div class="box q" id="mbox"><div class="lb" id="mlb">마이크로태스크 큐 (Promise.then) — 먼저 처리</div><div id="micro"></div></div>
  <div class="box q" id="tbox"><div class="lb" id="tlb">태스크 큐 (setTimeout 콜백) — 하나씩 처리</div><div id="task"></div></div>

  <div class="web">
    <b>Web API (브라우저 스레드가 처리)</b>
    <div class="hint">타이머 대기, fetch, 이벤트 감시 등은 여기서 진행</div>
    <div id="web"></div>
  </div>

  <div class="row">
    <div class="box t"><div class="lb">경과 시간</div><div class="big" id="time"></div></div>
    <div class="box o"><div class="lb">콘솔 출력</div><div class="out" id="out"></div></div>
  </div>

  <div class="note" id="note" aria-live="polite"></div>

  <div class="ctrl">
    <button id="prev">이전</button>
    <button id="play" class="primary">자동 재생</button>
    <button id="next">다음</button>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
var CODE=['setTimeout(function () {','  console.log("지연실행");','}, 3000);','Promise.resolve().then(() => console.log("프라미스"));','console.log("실행완료");'];
var LT0="이벤트 루프: 스택이 비었나? → 큐에서 꺼내 스택으로";
var S=[
{t:"시작",n:"모든 영역이 비어 있어요. 자바스크립트 스레드는 콜스택이 하나뿐인 싱글 스레드예요.",l:[],st:[],w:[],m:[],q:[],o:[],tm:"0.0s",lp:null,run:false},
{t:"main() 실행 시작",n:"스크립트 전체가 main()으로 콜스택에 올라가 위에서부터 실행돼요.",l:[0,1,2,3,4],st:["main()"],w:[],m:[],q:[],o:[],tm:"0.0s",lp:null,run:true},
{t:"setTimeout 호출 → Web API",n:"타이머를 Web API(브라우저)에 맡기고 등록번호(1)를 받아요. 콜백은 아직 실행되지 않아요.",l:[0,2],st:["main()","setTimeout()"],w:["타이머 #1 · 3.0s"],m:[],q:[],o:[],tm:"0.0s",lp:null,run:true},
{t:"Promise.then 호출 → 마이크로태스크 큐",n:"then의 콜백은 Web API를 거치지 않고 바로 마이크로태스크 큐에 등록돼요. 아직 실행되지 않아요.",l:[3],st:["main()","Promise.then()"],w:["타이머 #1 · 3.0s"],m:["콜백 (프라미스)"],q:[],o:[],tm:"0.0s",lp:null,run:true},
{t:"동기 코드는 바로 실행",n:"console.log('실행완료')는 큐를 기다리지 않고 바로 실행돼요.",l:[4],st:["main()","log('실행완료')"],w:["타이머 #1 · 3.0s"],m:["콜백 (프라미스)"],q:[],o:["실행완료"],tm:"0.0s",lp:null,run:true},
{t:"main() 종료, 스택이 빔",n:"콜스택이 비어 이벤트 루프가 큐를 확인해요. 마이크로태스크 큐에 콜백이 있어서 먼저 처리돼요.",l:[],st:[],w:["타이머 #1 · 3.0s"],m:["콜백 (프라미스)"],q:[],o:["실행완료"],tm:"0.0s",lp:"스택이 비었음 → 마이크로태스크 큐부터 확인",run:false},
{t:"마이크로태스크 먼저 실행",n:"마이크로태스크는 태스크 큐보다 항상 먼저 처리돼요. 콜백이 스택에 올라가 출력됩니다.",l:[3],st:["콜백","log('프라미스')"],w:["타이머 #1 · 3.0s"],m:[],q:[],o:["실행완료","프라미스"],tm:"0.0s",lp:"마이크로태스크 큐 → 콜스택",run:true},
{t:"스레드 대기, 타이머는 계속",n:"스택과 마이크로태스크 큐가 비었고 태스크 큐도 비었어요. 타이머는 브라우저 쪽에서 계속 카운트다운해요.",l:[],st:[],w:["타이머 #1 · 3.0s"],m:[],q:[],o:["실행완료","프라미스"],tm:"0.0s",lp:"큐가 모두 비어 있음 → 계속 대기",run:false},
{t:"3초 경과, 태스크 큐로 이동",n:"타이머가 만료되어 Web API가 콜백을 태스크 큐로 보내요. 바로 실행되지 않고 차례를 기다립니다.",l:[],st:[],w:[],m:[],q:["콜백 (지연실행)"],o:["실행완료","프라미스"],tm:"3.0s",lp:LT0,run:false},
{t:"태스크 큐에서 꺼내 실행",n:"스택과 마이크로태스크 큐가 비어 있으니 태스크 큐에서 하나를 꺼내 실행해요.",l:[1],st:["콜백","log('지연실행')"],w:[],m:[],q:[],o:["실행완료","프라미스","지연실행"],tm:"3.0s",lp:"태스크 큐 → 콜스택 (하나씩)",run:true},
{t:"모두 완료",n:"최종 출력은 실행완료, 프라미스, 지연실행이에요. 이벤트 루프는 새 작업을 계속 기다려요.",l:[],st:[],w:[],m:[],q:[],o:["실행완료","프라미스","지연실행"],tm:"3.0s",lp:LT0,run:false}
];
var i=0,timer=null;
var $=function(id){return document.getElementById(id)};
function chips(id,arr,cls){
  var e=$(id);e.innerHTML="";
  if(!arr.length){var s=document.createElement("span");s.className="empty";s.textContent="비어 있음";e.appendChild(s);return}
  arr.forEach(function(x){var d=document.createElement("div");d.className="chip "+cls;d.textContent=x;e.appendChild(d)});
}
function render(){
  var s=S[i];
  $("cnt").textContent=(i+1)+" / "+S.length;
  $("stitle").textContent=(i+1)+". "+s.t;
  var c=$("code");c.innerHTML="";
  CODE.forEach(function(line,k){var d=document.createElement("div");d.textContent=line;if(s.l.indexOf(k)>-1)d.className="on";c.appendChild(d)});
  var st=$("state");st.textContent=s.run?"실행 중":"대기 중";st.className="state"+(s.run?" run":"");
  chips("stack",s.st,"cs");
  if(!s.st.length){}
  chips("micro",s.m,"mt");chips("task",s.q,"tk");chips("web",s.w,"wa");
  $("mbox").className="box q"+(s.m.length?" mon":"");
  $("tbox").className="box q"+(s.q.length?" ton":"");
  var lp=$("loop");lp.className="loop"+(s.lp?" on":"");
  lp.textContent=s.lp?("이벤트 루프 동작: "+s.lp):LT0;
  $("time").textContent=s.tm;
  $("out").textContent=s.o.join("   ");
  $("note").textContent=s.n;
  $("prev").disabled=(i===0);
  $("next").disabled=(i===S.length-1);
  var ds=document.querySelectorAll(".dot");
  ds.forEach(function(d,k){d.className="dot"+(k===i?" cur":"");d.setAttribute("aria-current",k===i?"step":"false")});
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}
function stop(){if(timer){clearInterval(timer);timer=null}$("play").textContent="자동 재생"}
function play(){
  if(timer){stop();return}
  if(i===S.length-1)go(0);
  $("play").textContent="일시정지";
  timer=setInterval(function(){if(i>=S.length-1){stop();return}go(i+1)},3200);
}
var dots=$("dots");
S.forEach(function(s,k){var b=document.createElement("button");b.className="dot";b.setAttribute("aria-label",(k+1)+"단계: "+s.t);b.onclick=function(){stop();go(k)};dots.appendChild(b)});
$("prev").onclick=function(){stop();go(i-1)};
$("next").onclick=function(){stop();go(i+1)};
$("play").onclick=play;
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){stop();go(i+1)}
  else if(e.key==="ArrowLeft"){stop();go(i-1)}
  else if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();play()}
});
render();
</script>
</body>
</html>
