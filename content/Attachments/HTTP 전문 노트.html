<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTTP 전문 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F4F6F9;--surface:#FFFFFF;--ink:#161B23;--ink-2:#46505F;--ink-3:#69758A;
  --line:#D9DFE8;--line-2:#EAEEF3;
  --req:#2447C4;--req-bg:#E8EDFB;--on-req:#FFFFFF;
  --res:#0A6A5B;--res-bg:#DCF1EC;
  --mark:#FFE48A;--mark-ink:#4A3700;
  --env:#5B3DC2;--env-bg:#ECE8FA;
  --ok:#1A7A3D;--ok-bg:#DDF2E4;--bad:#B3261E;--bad-bg:#FAE3E0;--warn:#8A5700;--warn-bg:#FFF0D2;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,'D2Coding',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151B;--surface:#181D25;--ink:#E7EBF1;--ink-2:#B0BAC8;--ink-3:#8793A5;
    --line:#2A323E;--line-2:#222A35;
    --req:#8EA6FF;--req-bg:#1D2748;--on-req:#0E1426;
    --res:#5FD3BD;--res-bg:#12332D;
    --mark:#5A4710;--mark-ink:#FFE9A6;
    --env:#B9A6FF;--env-bg:#2A2347;
    --ok:#6FD58F;--ok-bg:#14301F;--bad:#FF9C94;--bad-bg:#3A1B19;--warn:#F2C26B;--warn-bg:#352A10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151B;--surface:#181D25;--ink:#E7EBF1;--ink-2:#B0BAC8;--ink-3:#8793A5;
  --line:#2A323E;--line-2:#222A35;
  --req:#8EA6FF;--req-bg:#1D2748;--on-req:#0E1426;
  --res:#5FD3BD;--res-bg:#12332D;
  --mark:#5A4710;--mark-ink:#FFE9A6;
  --env:#B9A6FF;--env-bg:#2A2347;
  --ok:#6FD58F;--ok-bg:#14301F;--bad:#FF9C94;--bad-bg:#3A1B19;--warn:#F2C26B;--warn-bg:#352A10;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:32px 0 14px}
h1{font-size:30px;line-height:1.25;font-weight:600;letter-spacing:-0.01em;margin:0 0 10px}
h2{font-size:22px;line-height:1.35;font-weight:600;margin:0 0 8px;letter-spacing:-0.005em}
h3{font-size:16px;line-height:1.5;font-weight:600;margin:0 0 4px}
p{margin:0 0 10px}
.lead{color:var(--ink-2);max-width:66ch}
.legend{font-size:13px;color:var(--ink-2);max-width:70ch;margin-top:8px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:14.5px;padding:11px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--req)}
main{padding:26px 0 56px;outline:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--req);outline-offset:2px}
.u{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.ck{color:var(--env);text-decoration:underline dotted;text-underline-offset:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.btn{font-size:14px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;line-height:1.4}
.btn:hover{border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--req-bg);border-color:var(--req);color:var(--req);font-weight:500}
.btn.go{background:var(--req);border-color:var(--req);color:var(--on-req);font-weight:500}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2);margin-left:6px;cursor:pointer}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:16px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr);gap:16px}}
.tg{border:1px solid var(--line);border-left-width:4px;border-radius:6px;background:var(--surface);overflow:hidden}
.tg.req{border-left-color:var(--req)}
.tg.res{border-left-color:var(--res)}
.tg-h{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.sec{display:grid;grid-template-columns:84px minmax(0,1fr);border-top:1px solid var(--line-2)}
.tg-h+.sec{border-top:0}
.sec-l{font-size:12px;line-height:1.5;color:var(--ink-3);padding:9px 10px;border-right:1px solid var(--line-2)}
.ln{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;padding:5px 12px;margin:0;border:0;background:none;color:var(--ink);text-align:left;font-family:var(--mono);font-size:13px;line-height:1.65}
button.ln{cursor:pointer}
button.ln:hover{background:var(--line-2)}
.req button.ln.sel{background:var(--req-bg)}
.res button.ln.sel{background:var(--res-bg)}
.ln .t{white-space:pre-wrap;word-break:break-all;min-width:0}
.ln .m{flex:none;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);white-space:nowrap;padding-top:1px}
.ph{color:var(--ink-3)}
@media (max-width:520px){.sec{grid-template-columns:62px minmax(0,1fr)}.ln .m{display:none}}
.note{border-left:3px solid var(--line);padding:2px 0 2px 16px}
.note p{color:var(--ink-2)}
.pn{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px 14px;min-width:0}
.pn h3{font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
.mono{font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-all}
.log div{white-space:pre-wrap;font-size:13.5px;line-height:1.6;padding:4px 0;border-top:1px solid var(--line-2)}
.log div:first-child{border-top:0}
.bd{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;margin:0 6px 6px 0;border:1px solid var(--line);color:var(--ink-2)}
.bd.y{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.vd{margin-top:14px;padding:9px 14px;border-left:3px solid var(--req);background:var(--req-bg);border-radius:0 6px 6px 0;font-size:14px}
.vd.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.vd.good{border-left-color:var(--ok);background:var(--ok-bg)}
.fine{font-size:12.5px;color:var(--ink-3);margin-top:10px;max-width:72ch}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:10px}
@media (max-width:760px){.flow{grid-template-columns:minmax(0,1fr)}}
.st{border-top:3px solid var(--line);padding-top:8px;min-width:0}
.st.s1{border-top-color:var(--ink-3)}.st.s2{border-top-color:var(--req)}.st.s3{border-top-color:var(--env)}.st.s4{border-top-color:var(--res)}
.st h3{font-size:13px;color:var(--ink-2);font-weight:500}
.st .main{font-size:14px;margin-bottom:4px}
.st .main.code{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.st .sub{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.tm{display:inline-block;font-size:11.5px;padding:0 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);margin:0 4px 4px 0}
dl.terms{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:0;margin:14px 0;border-top:1px solid var(--line)}
dl.terms dt,dl.terms dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line-2)}
dl.terms dt{font-weight:600;font-size:14.5px;padding-right:12px}
dl.terms dd{color:var(--ink-2);font-size:14.5px}
@media (max-width:520px){dl.terms{grid-template-columns:minmax(0,1fr)}dl.terms dt{border-bottom:0;padding-bottom:0}}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:14px;min-width:560px;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.fix{background:var(--warn-bg);color:var(--warn)}
.step{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line-2)}
.step:first-child{border-top:0}
.who{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.who.b{color:var(--req)}.who.s{color:var(--res)}
.org{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) 28px;gap:0;font-size:13.5px}
.org>div{padding:6px 8px;border-bottom:1px solid var(--line-2);word-break:break-all}
.org .h{font-weight:600;color:var(--ink-2);font-size:12.5px}
.org .ng{color:var(--bad);font-weight:600}.org .gd{color:var(--ok);font-weight:600}
ul.pl{margin:6px 0 10px;padding-left:20px;color:var(--ink-2)}
ul.pl li{margin:3px 0}
section.sub{margin-top:36px}
.cap{padding:5px 14px;font-size:12px;color:var(--ink-3);background:var(--line-2)}
.cap b{font-weight:600;color:var(--ink-2)}
code{font-family:var(--mono);font-size:.88em;background:var(--line-2);padding:1px 5px;border-radius:4px}
.pre{font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre;overflow-x:auto}
.in{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;max-width:380px;margin:6px 0 4px}
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.cv{border-top:3px solid var(--line);padding-top:6px;min-width:0}
.cv.yes{border-top-color:var(--ok)}.cv.no{border-top-color:var(--bad)}.cv.mid{border-top-color:var(--warn)}
.cv h3{font-size:13px;color:var(--ink-2);font-weight:500}
.cv .sym{font-size:26px;font-weight:600;line-height:1.3}
.cv.yes .sym{color:var(--ok)}.cv.no .sym{color:var(--bad)}.cv.mid .sym{color:var(--warn)}
.cv .sub2{font-size:13px;color:var(--ink-2)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:10px}
.gc{border-top:3px solid var(--line);padding-top:8px;min-width:0}
.gc h3{font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:8px}
.mc{display:inline-block;font-family:var(--mono);font-size:13px;padding:3px 11px;border-radius:6px;margin:0 6px 6px 0;border:1px solid transparent}
.gc.g0{border-top-color:var(--req)}.gc.g0 .mc{background:var(--req-bg);color:var(--req)}
.gc.g1{border-top-color:var(--env)}.gc.g1 .mc{background:var(--env-bg);color:var(--env)}
.gc.g2{border-top-color:var(--res)}.gc.g2 .mc{background:var(--res-bg);color:var(--res)}
.gc.g3{border-top-color:var(--warn)}.gc.g3 .mc{background:var(--warn-bg);color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.btn,.tab,button.ln{transition:background-color .12s,border-color .12s,color .12s}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>HTTP 전문 노트</h1>
    <p class="lead">요청과 응답이 실제로 어떤 글자로 오가는지 눌러 보며 익히는 한 장 정리입니다. 같은 댓글 예시 하나로 전문 구조, 메서드, 안전·멱등·캐시, 쿠키와 저장소, Content-Type, CORS까지 이어집니다.</p>
    <p class="legend">표시 규칙: <span class="u">노란 바탕</span>은 사용자가 입력한 값, <span class="ck">보라색 점선</span>은 로그인(쿠키) 정보이고, 나머지는 브라우저나 서버가 알아서 채운 값입니다.</p>
  </div>
</header>
<nav aria-label="주제"><div class="wrap" id="nav" role="tablist"></div></nav>
<main class="wrap" id="main" tabindex="-1" role="tabpanel"></main>

<script>
(function(){
'use strict';
var TABS=[['frame','전문 구조'],['terms','용어 흐름'],['methods','메서드 시뮬레이터'],['ctype','Content-Type'],['state','캐시·무상태'],['cookie','쿠키'],['storage','저장소·세션'],['cors','CORS'],['sum','한눈에 정리']];
var tab='frame';
var mainEl=document.getElementById('main');
var navEl=document.getElementById('nav');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function U(s){return '<span class="u">'+s+'</span>';}
function CK(s){return '<span class="ck">'+s+'</span>';}
function segBtns(act,arr,cur){
  var h='<div class="seg" role="group">';
  arr.forEach(function(a){h+='<button type="button" class="btn" aria-pressed="'+(a[0]===cur)+'" data-a="'+act+'" data-v="'+a[0]+'">'+a[1]+'</button>';});
  return h+'</div>';
}
function msgBlock(kind,title,sub,groups,selId,act){
  var h='<div class="tg '+kind+'"><div class="tg-h"><span>'+title+'</span><span>'+(sub||'')+'</span></div>';
  groups.forEach(function(g,gi){
    if(gi===0)h+='<div class="cap"><b>'+(kind==='req'?'요청 헤드':'응답 헤드')+'</b> = '+(kind==='req'?'시작 줄':'상태 줄')+' + 헤더</div>';
    if(g.l==='본문')h+='<div class="cap"><b>본문(body)</b> = 페이로드</div>';
    h+='<div class="sec"><div class="sec-l">'+g.l+'</div><div>';
    g.lines.forEach(function(x){
      var inner=(x.t==='')?'<span class="ph">'+(x.ph||'(빈 줄)')+'</span>':x.t;
      var m=x.m?'<span class="m">'+x.m+'</span>':'';
      if(act){h+='<button type="button" class="ln'+(x.id===selId?' sel':'')+'" data-a="'+act+'" data-v="'+x.id+'"><span class="t">'+inner+'</span>'+m+'</button>';}
      else{h+='<div class="ln"><span class="t">'+inner+'</span>'+m+'</div>';}
    });
    h+='</div></div>';
  });
  return h+'</div>';
}

/* ───────── 1. 전문 구조 ───────── */
var COMMON={
  host:['Host: 어느 서버로 보내는가','요청을 받을 서버입니다. 사용자가 접속한 주소에서 브라우저가 채웁니다.'],
  ua:['User-Agent: 브라우저 종류','요청을 보내는 앱, 운영체제, 버전을 알려 주는 환경 정보입니다. 브라우저가 자동으로 붙이지만 바꿀 수 있어서 믿을 수 있는 값은 아닙니다.'],
  accept:['Accept: 받고 싶은 응답 형식','클라이언트가 처리할 수 있는 응답 형식입니다. 지금 보내는 본문의 형식인 Content-Type과는 다릅니다.'],
  al:['Accept-Language: 브라우저 언어','브라우저의 언어 설정이 반영되는 선호 정보입니다. 서버는 이 값을 참고해 응답 언어를 고를 수 있습니다.'],
  cookie:['Cookie: 로그인 같은 상태를 이어 주는 정보','HTTP는 이전 요청을 기억하지 않는(무상태) 프로토콜입니다. 로그인 상태는 서버가 내려 준 값을 브라우저가 매 요청에 실어 보내는 방식으로 이어집니다.']
};
function reqHeads(){
  return [
    {id:'host',t:'Host: developer.mozilla.org',m:'자동'},
    {id:'ua',t:'User-Agent: Mozilla/5.0 (Windows NT 10.0) Firefox/130.0',m:'브라우저 종류'},
    {id:'accept',t:'Accept: text/html',m:'받을 수 있는 형식'},
    {id:'al',t:'Accept-Language: ko-KR,ko;q=0.9',m:'브라우저 언어'},
    {id:'cookie',t:CK('Cookie: sid=abc123'),m:'로그인 정보'}
  ];
}
function ext(a,b){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o;}
var FR={
  get:{kind:'req',title:'요청 전문 · GET',sub:'가져오기',
    groups:[
      {l:'시작 줄',lines:[{id:'start',t:'GET /search?'+U('q=http&amp;lang=ko')+' HTTP/1.1',m:'요청 방식은 여기'}]},
      {l:'헤더',lines:reqHeads()},
      {l:'빈 줄',lines:[{id:'blank',t:''}]},
      {l:'본문',lines:[{id:'body',t:'',ph:'(본문 없음)'}]}
    ],
    notes:ext(COMMON,{
      start:['시작 줄: 요청 방식(메서드)이 있는 곳','GET은 자원을 읽어 오는 전용 메서드입니다. “요청 방식”은 요청 헤드의 첫 줄인 시작 줄에 적힙니다(메서드, 요청 타겟, HTTP 버전). 사용자가 입력한 검색어는 물음표 뒤의 쿼리 문자열에 실립니다. 요청 타겟은 보통 경로이고, 프록시에는 전체 URL(absolute 형식), CONNECT에는 host:port(authority 형식), OPTIONS에는 *(asterisk 형식)를 쓰기도 합니다.'],
      blank:['빈 줄: 헤더의 끝','이 줄 앞은 요청 헤드(시작 줄과 헤더), 뒤는 본문입니다. GET은 대개 이 빈 줄에서 끝납니다.'],
      body:['본문: GET에는 보통 없습니다','GET에 본문을 담는 것은 의미가 정의되어 있지 않아 피하는 것이 좋습니다. 그래서 본문 설명 헤더(Content-Type, Content-Length)도 보통 없고, 입력값은 쿼리 문자열로 보냅니다.']
    })},
  post:{kind:'req',title:'요청 전문 · POST',sub:'데이터 제출',
    groups:[
      {l:'시작 줄',lines:[{id:'start',t:'POST /comments HTTP/1.1',m:'요청 방식은 여기'}]},
      {l:'헤더',lines:reqHeads()},
      {l:'본문 설명 헤더',lines:[
        {id:'ct',t:'Content-Type: application/x-www-form-urlencoded',m:'요청 데이터 형식'},
        {id:'cl',t:'Content-Length: 26',m:'본문 길이'}]},
      {l:'빈 줄',lines:[{id:'blank',t:''}]},
      {l:'본문',lines:[{id:'body',t:U('name=minsu&amp;text=hi%20there'),m:'서버로 보낼 데이터'}]}
    ],
    notes:ext(COMMON,{

var MS={m:'GET',cookie:true};

function mSend(){

    MS.log.push('#'+MS.sends+'  401 Unauthorized · 쿠키가 없어 변경을 거부함 (서버 데이터 그대로)');

    else{k=mFind(87);if(k>=0){MS.comments.splice(k,1);res={status:'204 No Content',headers:[],body:''};MS.log.push('#'+MS.sends+'  204 No Content · 87번 삭제');}else{res={status:'404 Not Found',headers:['Content-Length: 0'],body:''};MS.log.push('#'+MS.sends+'  404 Not Found · 이미 없음');}}

var CTV={json:'application/json',form:'application/x-www-form-urlencoded',multi:'multipart/form-data; boundary=xyz'};
var CTL={json:'JSON',form:'폼 (urlencoded)',multi:'multipart'};
var CBODY={form:'name=minsu&text=hello',json:'{"name":"minsu","text":"hello"}',multi:'--xyz\r\nContent-Disposition: form-data; name="name"\r\n\r\nminsu\r\n--xyz\r\nContent-Disposition: form-data; name="text"\r\n\r\nhello\r\n--xyz--'};
var CS={ct:'json',body:'json',srv:'json'};
function cRes(){
  var acc=CTV[CS.srv].split(';')[0];
  if(CS.ct!==CS.srv)return {status:'415 Unsupported Media Type',headers:['Accept-Post: '+acc],cls:'bad',why:'서버가 이 Content-Type을 받지 않습니다. 본문을 읽어 보기 전에 이름표만 보고 거절하며, Accept-Post 헤더로 받을 수 있는 형식을 알려 줄 수 있습니다.'};
  if(CS.body!==CS.ct)return {status:'400 Bad Request',headers:['Content-Length: 0'],cls:'bad',why:'이름표(Content-Type)와 실제 본문의 모양이 달라 서버가 본문을 읽지 못합니다. 이런 경우의 응답 코드는 서버마다 다를 수 있습니다.'};
  return {status:'201 Created',headers:['Location: /comments/88','Content-Length: 0'],cls:'good',why:'이름표와 본문이 일치하고 서버가 받는 형식이라 정상 처리됩니다.'};
}

  h+='<h3>실제 본문의 모양</h3>'+segBtns('cbd',opts,CS.body);
  h+='<h3>서버가 받는 형식</h3>'+segBtns('csv',[['json','JSON만'],['form','폼만'],['multi','multipart만']],CS.srv);
  var rq=[
    {l:'시작 줄',lines:[{t:'POST /comments HTTP/1.1'}]},
    {l:'본문 설명 헤더',lines:[{t:'Content-Type: '+esc(CTV[CS.ct]),m:'이름표'},{t:'Content-Length: '+CBODY[CS.body].length}]},
    {l:'빈 줄',lines:[{t:''}]},
    {l:'본문',lines:[{t:U(esc(bodyShow)),m:CTL[CS.body]}]}
  ];
  var rs=[
    {l:'상태 줄',lines:[{t:'HTTP/1.1 '+r.status}]},
    {l:'응답 헤더',lines:r.headers.map(function(x){return {t:esc(x)};})},
    {l:'빈 줄',lines:[{t:''}]},
    {l:'본문',lines:[{t:'',ph:'(본문 없음)'}]}

var KS={api:'cross',req:'simple',cfg:'none'};

    return {steps:s,ok:true,msg:'서버가 허용 헤더를 내려 주어 브라우저가 응답을 전달했습니다.'};

  s.push({w:'b',t:'브라우저 판단',c:'출처, 메서드, 헤더가 모두 허용됨 → 실제 요청을 보냄 (사전 요청 결과는 3600초 동안 기억)'});

  h+='</div><div class="vd '+(r.ok?'good':'bad')+'" aria-live="polite">'+(r.ok?'성공: ':'CORS 오류: ')+r.msg+'</div>';

var CO={life:'persist',ho:true,se:true,ss:'Lax',scen:'same',jar:null,log:[],msg:'',cls:''};

function coLine(){

var Z0='처음';
var ZS={};
function zInit(m){ZS={mode:m||'local',mem:Z0,local:null,sess:null,srv:Z0,log:[],msg:'',cls:''};}
zInit('local');
function zJson(v){return JSON.stringify({state:{text:v},version:0});}
function zSave(){if(ZS.mode==='local')ZS.local=zJson(ZS.mem);else if(ZS.mode==='session')ZS.sess=zJson(ZS.mem);}
function zRead(raw){try{return JSON.parse(raw).state.text;}catch(e){return null;}}
function zHydrate(){
  var raw=ZS.mode==='local'?ZS.local:ZS.mode==='session'?ZS.sess:null;
  if(raw){var t=zRead(raw);if(t!==null){ZS.mem=t;return true;}}
  return false;
}
function zWhere(){return ZS.mode==='local'?'localStorage':'sessionStorage';}
function zEdit(){
  ZS.mem+='!';zSave();
  ZS.log.push('Immer로 상태 변경 → 메모리: “'+ZS.mem+'”'+(ZS.mode==='mem'?' (저장하지 않음)':' → persist가 '+zWhere()+'에도 저장'));
  ZS.msg=ZS.mode==='mem'?'메모리 상태만 바뀌었습니다. persist가 없어서 어디에도 저장되지 않습니다.':'메모리 상태가 바뀌고, 같은 순간 persist가 '+zWhere()+'에 기록했습니다.';ZS.cls='';
}
function zRefresh(){
  ZS.mem=Z0;var ok=zHydrate();
  ZS.log.push('새로고침 → 메모리가 초기화됨'+(ok?' → '+zWhere()+'에서 복원: “'+ZS.mem+'”':' → 복원할 저장 값이 없어 초기값 “'+ZS.mem+'”'));
  ZS.msg=ok?'persist가 저장소의 값으로 상태를 복원했습니다(하이드레이션).':'메모리의 상태는 새로고침하면 사라집니다.';ZS.cls=ok?'good':'bad';
}
function zNewTab(){

}
function zQuit(){
  ZS.mem=Z0;ZS.sess=null;var ok=zHydrate();

    +'<tr><td>쿠키는 항상 요청 헤더에 실어서 간다</td><td><span class="tag fix">보정</span></td><td>저장 지시는 응답의 <code>Set-Cookie</code>, 전달은 요청의 <code>Cookie</code>입니다. 쿠키의 도메인, 경로, <code>Secure</code>, <code>SameSite</code> 조건이 맞을 때 붙습니다.</td></tr>'
    +'<tr><td>쿠키를 필요로 하는 건 서버</td><td><span class="tag ok">맞음</span></td><td>서버가 쿠키 값으로 누구의 요청인지 알아봅니다.</td></tr>'
    +'<tr><td>개인의 흔적이 쿠키에 남고, 이러다 없어짐</td><td><span class="tag ok">맞음</span></td><td>식별 값이 담기고, 세션 쿠키는 브라우저를 닫을 때, 지속 쿠키는 만료될 때 사라집니다.</td></tr>'
    +'</tbody></table></div>';
  h+='<h3 style="margin-top:24px">대화 중 바로잡은 내용</h3><ul class="pl">'
    +'<li>“POST = 등록”은 “데이터를 제출해 서버가 처리”로 넓혔습니다. 로그인이 대표적인 예외입니다.</li>'
    +'<li>POST 캐시를 “제한적”이라고만 했던 부분은 “신선도 정보와 Content-Location이 있을 때만”으로 구체화했습니다.</li>'
    +'<li>JSON 본문 예시의 Content-Length를 앞서 37이라고 적었는데 실제 본문 {"name":"minsu","text":"hello"}는 31바이트입니다.</li>'
    +'<li>“요청 방식과 응답 코드는 헤더가 아니다”라고 했던 부분은, 헤드(시작 줄 + 헤더) 기준으로는 맞는 말이라는 점을 반영해 “정밀화”로 바꿨습니다. 헤더 줄과 시작 줄을 구분하기 위한 엄밀한 용어 문제입니다.</li>'
    +'<li>“사용자 입력 대 환경 정보”는 이해를 돕는 틀이고, MDN의 공식 분류는 General, Request, Representation 헤더입니다.</li></ul>';
  h+='<h3 style="margin-top:24px">확인 수준</h3><ul class="pl">'
    +'<li>MDN 원문으로 확인: 메시지 구조와 헤드·본문 정의, GET·POST·PUT·PATCH·DELETE의 정의(DELETE 요청에는 본문이 없고, 본문의 의미가 정의되지 않았다는 점 포함), 안전·멱등·캐시 용어집, Content-Type 헤더, 415와 Accept-Post, Set-Cookie 문법과 세션·지속 쿠키 구분, Web Storage의 키-값 저장과 출처별 분리.</li>'
    +'<li>Zustand 공식 문서로 확인: persist의 저장소 선택(기본 localStorage)과 partialize, immer 미들웨어의 사용법과 Immer 규칙 주의. 미들웨어를 겹치는 순서는 제3자 가이드 기준입니다.</li>'
    +'<li>MDN을 인용한 문서나 학습 자료로 확인: 무상태성, CORS의 정의와 사전 요청 흐름, 쿠키의 자동 전송과 보안 속성, 용량(쿠키 약 4KB, Web Storage 약 5MB), sessionStorage의 탭 단위 동작.</li>'
    +'<li>일반 지식이거나 시뮬레이터의 가정: 쿠키 로그인 흐름, 401·400 같은 구체적 응답 코드, 응답 헤더 값, “변경에는 로그인 필요” 같은 서버 규칙, CORS 단순 요청의 세부 조건, SameSite의 세부 동작, 토큰·XSS·CSRF 비교, “무엇을 어디에 둘까” 표, persist 저장 JSON의 모양, Map/Set 주의.</li></ul>';
  return h;
}

/* ───────── 렌더링과 이벤트 ───────── */
function renderNav(){
  navEl.innerHTML=TABS.map(function(t){return '<button type="button" class="tab" role="tab" aria-selected="'+(t[0]===tab)+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('');
}
function render(){
  var key=null,ae=document.activeElement;
  if(ae&&ae.getAttribute&&ae.getAttribute('data-a')){key=ae.getAttribute('data-a')+'|'+(ae.getAttribute('data-v')||'');}
  var v={frame:vFrame,terms:vTerms,methods:vMethods,ctype:vCtype,state:vState,cookie:vCookie,storage:vStorage,cors:vCors,sum:vSum}[tab];
  mainEl.innerHTML=v();
  renderNav();
  if(key){
    var parts=key.split('|'),sel='[data-a="'+parts[0]+'"]'+(parts[1]?'[data-v="'+parts[1]+'"]':'');
    var n=document.querySelector(sel);
    if(n&&n.focus)n.focus({preventScroll:true});
  }
}
function act(a,v,el){
  switch(a){
    case 'tab':tab=v;break;
    case 'fv':FS.v=v;FS.sel='start';break;
    case 'fl':FS.sel=v;break;
    case 'sc':TS.i=parseInt(v,10);break;
    case 'mm':MS.m=v;mReset();break;
    case 'mck':MS.cookie=!!el.checked;break;
    case 'msend':mSend();break;
    case 'mreset':mReset();break;
    case 'cct':CS.ct=v;break;
    case 'cbd':CS.body=v;break;
    case 'csv':CS.srv=v;break;
    case 'ca':caAct(v);break;
    case 'careset':CA={cache:false,server:0,hit:0,log:[]};break;
    case 'selogin':seLogin();break;
    case 'seme':seMe();break;
    case 'sereset':SE={jar:null,sess:false,use:true,log:[]};break;
    case 'seck':SE.use=!!el.checked;break;
    case 'kapi':KS.api=v;break;
    case 'kreq':KS.req=v;break;
    case 'kcfg':KS.cfg=v;break;
    case 'col':CO.life=v;break;
    case 'coh':CO.ho=!!el.checked;break;
    case 'cos':CO.se=!!el.checked;break;
    case 'coss':CO.ss=v;break;
    case 'cosc':CO.scen=v;break;
    case 'coset':coSet();break;
    case 'coreq':coReq();break;
    case 'coread':coRead();break;
    case 'coclose':coClose();break;
    case 'cohour':coHour();break;
    case 'coreset':CO={life:'persist',ho:true,se:true,ss:'Lax',scen:'same',jar:null,log:[],msg:'',cls:''};break;
    case 'gr':GR.k=v;break;
    case 'ev':ST.ev=v;break;
    case 'zm':zInit(v);break;
    case 'zedit':zEdit();break;
    case 'zrefresh':zRefresh();break;
    case 'znewtab':zNewTab();break;
    case 'zquit':zQuit();break;
    case 'zsend':zSend();break;
    case 'zreset':zInit(ZS.mode);break;
    default:return;
  }
  render();
}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-a]'):null;
  if(!b||b.tagName==='INPUT')return;
  act(b.getAttribute('data-a'),b.getAttribute('data-v'),b);
});
document.addEventListener('change',function(e){
  var b=e.target;
  if(b&&b.tagName==='INPUT'&&b.getAttribute('data-a'))act(b.getAttribute('data-a'),null,b);
});
document.addEventListener('input',function(e){
  var b=e.target;
  if(b&&b.getAttribute&&b.getAttribute('data-a')==='gl'){var g=document.getElementById('glbox');if(g)g.innerHTML=glHtml(b.value);}
});
window.__act=act;
mReset();
var h0=(location.hash||'').replace('#','');
TABS.forEach(function(t){if(t[0]===h0)tab=h0;});
render();
})();
</script>
